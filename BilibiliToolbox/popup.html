<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B&#31449;&#24037;&#20855;&#31665;</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #181818;
            color: #fff;
        }
        .header {
            background: #fb7299;
            color: #fff;
            padding: 14px 16px;
            text-align: center;
        }
        .header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; }
        .header p { font-size: 11px; opacity: 0.85; margin-top: 2px; }
        .content { padding: 12px; }
        .section {
            background: #1f1f1f;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .section-title { font-size: 13px; color: #b3b3b3; margin-bottom: 10px; font-weight: 500; }
        .user-list { max-height: 200px; overflow-y: auto; }
        .user-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .user-item:hover { background: rgba(255,255,255,0.06); }
        .user-info { display: flex; align-items: center; gap: 8px; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .user-name { font-size: 13px; color: #fff; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .user-actions { display: flex; gap: 6px; }
        .user-link {
            padding: 4px 10px;
            font-size: 11px;
            color: #fb7299;
            text-decoration: none;
            border: 1px solid #fb7299;
            border-radius: 999px;
            transition: all 0.2s;
        }
        .user-link:hover { background: #fb7299; color: #fff; }
        .delete-btn {
            padding: 4px 10px;
            font-size: 11px;
            color: #b3b3b3;
            background: none;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .delete-btn:hover { background: #f3727f; color: #fff; border-color: #f3727f; }
        .empty-tip { text-align: center; color: #7c7c7c; font-size: 12px; padding: 20px; }
        .storage-note {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 12px;
            line-height: 1.5;
            color: #b3b3b3;
        }
        .storage-note.readonly { color: #ffa42b; }
        .btn {
            width: 100%;
            padding: 10px;
            background: #fb7299;
            color: #fff;
            border: none;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #fc8bab; }
        .btn:disabled,
        .delete-btn:disabled { cursor: not-allowed; opacity: 0.5; }
        .btn:disabled:hover { background: #fb7299; }
        .delete-btn:disabled:hover { background: none; color: #999; border-color: rgba(255,255,255,0.1); }

        .user-list::-webkit-scrollbar { width: 4px; }
        .user-list::-webkit-scrollbar-track { background: transparent; }
        .user-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>B&#31449;&#24037;&#20855;&#31665;</h1>
        <p>&#28459;&#30011;&#38405;&#35835;&#19982;&#24555;&#25463;&#25910;&#34255;</p>
    </div>
    <div class="content">
        <div class="section">
            <div class="section-title">&#25910;&#34255;&#21015;&#34920;</div>
            <div class="storage-note" id="storageNote"></div>
            <div class="user-list" id="userList">
                <div class="empty-tip">&#26242;&#26080;&#25910;&#34255;</div>
            </div>
        </div>
        <button type="button" class="btn" id="addCurrentBtn">+ &#28155;&#21152;&#24403;&#21069;&#39029;&#38754;</button>
    </div>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
</body>
</html>
